  <style>
    *, *::before, *::after {
      border-radius: 0px !important;
      box-sizing: border-box;
    }

    html, body {
      background-color: #191919;
      color: #F5F4F0;
      font-family: 'IBM Plex Mono', monospace;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .brutal-card {
      background-color: #1D1D1D;
      border: 2px solid #F5F4F0;
      box-shadow: 4px 4px 0px #080808;
    }

    .brutal-card.picked {
      border-color: #C6FF00;
      box-shadow: 4px 4px 0px #C6FF00;
    }

    .brutal-btn-lime {
      background-color: #C6FF00;
      color: #111111;
      border: 2px solid #F5F4F0;
      box-shadow: 4px 4px 0px #080808;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .brutal-btn-lime:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px #080808;
    }

    .rate-btn {
      background-color: #111111;
      border: 1px solid #383838;
      color: #F5F4F0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 7px 0;
      cursor: pointer;
    }

    .rate-btn:hover {
      border-color: #F5F4F0;
      background-color: #282828;
    }

    .rate-btn.active {
      background-color: #F5F4F0;
      border-color: #F5F4F0;
      color: #111111;
    }

    .pick-btn {
      background-color: #111111;
      border: 2px solid #F5F4F0;
      color: #F5F4F0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 10px 12px;
      width: 100%;
      cursor: pointer;
    }

    .pick-btn:hover {
      background-color: #282828;
    }

    .brutal-card.picked .pick-btn {
      background-color: #C6FF00;
      border-color: #F5F4F0;
      color: #111111;
    }

      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
