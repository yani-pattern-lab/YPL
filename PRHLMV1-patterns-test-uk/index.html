<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Тестування патернів · Vol. 1</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgmain: '#202020',
            surface: '#292929',
            deep: '#181818',
            offwhite: '#F5F4F0',
            muted: '#A8A8A8',
            lime: '#C6FF00',
            darkink: '#111111',
            borderdim: '#444444',
          },
          fontFamily: {
            display: ['"Unbounded"', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    *, *::before, *::after {
      border-radius: 0px !important;
      box-sizing: border-box;
    }

    html, body {
      background-color: #202020;
      color: #F5F4F0;
      font-family: 'IBM Plex Mono', monospace;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .brutal-card {
      background-color: #292929;
      border: 2px solid #F5F4F0;
      box-shadow: 4px 4px 0px #0D0D0D;
    }

    .brutal-card.picked {
      border-color: #C6FF00;
      box-shadow: 4px 4px 0px #C6FF00;
    }

    .brutal-btn-lime {
      background-color: #C6FF00;
      color: #111111;
      border: 2px solid #F5F4F0;
      box-shadow: 4px 4px 0px #0D0D0D;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .brutal-btn-lime:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px #0D0D0D;
    }

    .rate-btn {
      background-color: #181818;
      border: 1px solid #444444;
      color: #F5F4F0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 7px 0;
      cursor: pointer;
    }

    .rate-btn:hover {
      border-color: #F5F4F0;
      background-color: #303030;
    }

    .rate-btn.active {
      background-color: #F5F4F0;
      border-color: #F5F4F0;
      color: #111111;
    }

    .pick-btn {
      background-color: #181818;
      border: 2px solid #F5F4F0;
      color: #F5F4F0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 10px 12px;
      width: 100%;
      cursor: pointer;
    }

    .pick-btn:hover {
      background-color: #303030;
    }

    .brutal-card.picked .pick-btn {
      background-color: #C6FF00;
      border-color: #F5F4F0;
      color: #111111;
    }

    .protected-img {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .protected-img img {
      pointer-events: none;
    }

    .watermark-grid {
      position: absolute;
      inset: -30%;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      transform: rotate(-28deg);
      pointer-events: none;
      opacity: 0.28;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #F5F4F0;
      white-space: nowrap;
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-bgmain text-offwhite pb-28" oncontextmenu="return false;">

  <header class="w-full border-b-2 border-borderdim bg-bgmain sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="font-display font-black text-xs sm:text-sm tracking-tight uppercase text-offwhite">
        ЗАКРИТИЙ ТЕСТ · VOL. 1
      </div>
      <div class="font-mono text-[10px] sm:text-xs font-bold uppercase tracking-wider bg-lime text-darkink px-2 py-1 border border-offwhite">
        27 ПАТЕРНІВ
      </div>
    </div>
  </header>

  <main class="w-full max-w-5xl mx-auto px-4 py-6 sm:py-8 flex-grow">
    <div id="main-view" class="space-y-6">

      <section class="brutal-card p-5 sm:p-6 space-y-4">
        <h1 class="font-display font-black text-2xl sm:text-3xl leading-[1.1] tracking-tight uppercase text-offwhite">
          ОЦІНИ 27 ПАТЕРНІВ ТА ОБЕРИ МІНІМУМ ОДИН НА ТЕСТ
        </h1>

        <p class="font-mono text-xs sm:text-sm leading-relaxed text-muted max-w-3xl">
          Натисни на картинку, щоб роздивитися ближче. Постав кожному патерну оцінку від 0 до 10 і натисни «Обрати на тест» під тими, які хочеш отримати роздрукованими.
        </p>

        <div class="max-w-md pt-1 space-y-2">
          <label for="tester-name" class="block font-mono text-xs sm:text-sm font-bold text-offwhite">
            Твоє прізвище та ім’я <span class="text-lime">*</span>
          </label>
          <input
            type="text"
            id="tester-name"
            autocomplete="name"
            placeholder="Наприклад: Олена Коваленко"
            class="w-full border-2 border-offwhite bg-deep px-3.5 py-3 font-mono text-sm text-offwhite placeholder:text-muted/50 focus:outline-none focus:border-lime"
          />
          <div id="validation-error" class="hidden bg-lime text-darkink font-mono text-xs font-bold px-3 py-2 border border-offwhite"></div>
        </div>
      </section>

      <!-- Сітка 27 патернів -->
      <section id="patterns-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></section>
    </div>

    <!-- Екран після відправки -->
    <section id="done-screen" class="hidden max-w-xl mx-auto my-8 brutal-card p-6 sm:p
