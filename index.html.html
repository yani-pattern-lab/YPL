<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yani Pattern Lab — Under Construction</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #18181b;
      color: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background-color: #27272a;
      border: 1px solid #3f3f46;
      max-width: 520px;
      width: 100%;
      padding: 48px 32px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #a1a1aa;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-block;
      background-color: #18181b;
      color: #e4e4e7;
      border: 1px solid #3f3f46;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.03em;
      padding: 6px 16px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Yani Pattern Lab</h1>
    <p>Our website is currently under construction.<br>Something great is coming soon.</p>
    <span class="badge">yanipatternlab.com</span>
  </div>
</body>
</html>
