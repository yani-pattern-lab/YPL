<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yani Pattern Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      max-width: 520px;
      width: 100%;
      padding: 48px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #111827;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background-color: #eef2ff;
      color: #4f46e5;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Yani Pattern Lab</h1>
    <p>Сайт перебуває в розробці. Незабаром тут з’явиться оновлений проєкт.</p>
    <span class="badge">yanipatternlab.com</span>
  </div>
</body>
</html>
